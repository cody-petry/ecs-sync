SecAction "id:90000, phase:1, pass, nolog, initcol:ip=%{REMOTE_ADDR}"

SecRule REQUEST_URI "@streq /custom-errors/access-denied.html" \
    "id:90001, phase:1, pass, nolog, skipAfter:ALLOW_ERROR_PAGE"

SecRule REQUEST_URI "@streq /" \
    "id:90002, phase:3, pass, log, initcol:ip=%{REMOTE_ADDR}, msg:'Login failed - redirected back to login page', chain"
SecRule REQUEST_METHOD "@streq POST" \
    "chain"
SecRule RESPONSE_HEADERS:Location "@streq /login/index.html" \
    "setvar:ip.failed_login_counter=+1, expirevar:ip.failed_login_counter=300"

SecRule IP:FAILED_LOGIN_COUNTER "@ge 5" \
    "id:90003, phase:1, log, redirect:/custom-errors/access-denied.html, status:302, msg:'Redirected to access denied page due to excessive failed logins'"

SecMarker ALLOW_ERROR_PAGE
